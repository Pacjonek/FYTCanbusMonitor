name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release-unsigned-and-debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug :example:assembleDebug --no-daemon

      - name: Upload debug APK artifact (app)
        uses: actions/upload-artifact@v4
        with:
          name: canbusmonitor-app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload debug APK artifact (example)
        uses: actions/upload-artifact@v4
        with:
          name: canbusmonitor-example-debug-apk
          path: example/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build unsigned release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release-unsigned-and-debug'
        run: ./gradlew :app:assembleRelease :example:assembleRelease --no-daemon

      - name: Upload unsigned release APK artifact (app)
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release-unsigned-and-debug'
        uses: actions/upload-artifact@v4
        with:
          name: canbusmonitor-app-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload unsigned release APK artifact (example)
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release-unsigned-and-debug'
        uses: actions/upload-artifact@v4
        with:
          name: canbusmonitor-example-release-unsigned-apk
          path: example/build/outputs/apk/release/*.apk
          if-no-files-found: error
