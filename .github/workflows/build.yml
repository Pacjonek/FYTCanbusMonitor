name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release-unsigned-and-debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: canbusmonitor-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Build unsigned release APK
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release-unsigned-and-debug'
        run: gradle assembleRelease --no-daemon

      - name: Upload unsigned release APK artifact
        if: github.event_name == 'workflow_dispatch' && inputs.build_type == 'release-unsigned-and-debug'
        uses: actions/upload-artifact@v7
        with:
          name: canbusmonitor-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          
