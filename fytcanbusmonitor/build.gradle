plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}
def getVersionName = { ->
    return "0.0.2"
}

android {
    namespace = "com.aoe.fytcanbusmonitor"
    compileSdk 37

    defaultConfig {
        targetSdk 33
        minSdk 33

        // testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            // proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions {
        jvmTarget = '21'
    }
}

dependencies {

    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.google.android.material:material:1.14.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}

apply plugin: 'maven-publish'

def githubProperties = new Properties()
def githubPropertiesFile = rootProject.file("github.properties")
if (githubPropertiesFile.exists()) {
    githubPropertiesFile.withInputStream { githubProperties.load(it) }
}

def getArtifactId = { ->
    return "fytcanbusmonitor" // Replace with library name ID
}

publishing {
    publications {
        bar(MavenPublication) {
            groupId 'com.aoe' // Replace with group ID
            artifactId getArtifactId()
            version getVersionName()
            artifact("${layout.buildDirectory.get()}/outputs/aar/${getArtifactId()}-release.aar")
        }
    }

    repositories {
        maven {
            name = "GitHubPackages"
            /** Configure path of your package repository on Github
             *  Replace GITHUB_USERID with your/organisation Github userID and REPOSITORY with the repository name on GitHub
             */
            url = uri("https://maven.pkg.github.com/AxesOfEvil/FYTCanbusMonitor")

            credentials {
                /**Create github.properties in root project folder file with gpr.usr=GITHUB_USER_ID  & gpr.key=PERSONAL_ACCESS_TOKEN**/
                username = githubProperties['gpr.usr'] ?: System.getenv("GPR_USER")
                password = githubProperties['gpr.key'] ?: System.getenv("GPR_API_KEY")
            }
        }
    }
}

